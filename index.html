<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salão Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0;--sidebar:#18182a;--sidebar-hover:#26263d;
  --card:#ffffff;--border:#e8e0d4;--border2:#d4c9b8;
  --accent:#c8873a;--accent-d:#a86e2a;--accent-light:#fdf4e8;
  --text:#1e1810;--text2:#6b5d4a;--text3:#a8967e;
  --success:#277a46;--success-bg:#eaf6f0;--success-border:#b8dfc9;
  --info:#1a5faa;--info-bg:#e8f1fb;--info-border:#b0cef0;
  --danger:#b83030;--danger-bg:#fceaea;--danger-border:#f0b8b8;
  --warn:#8a6010;--warn-bg:#fef8e8;--warn-border:#f0d898;
  --r:8px;--r-lg:12px;
  --font:'Nunito',sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}

/* ── LOADING ── */
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:999}
#boot .sp{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login-wrap{display:none;align-items:center;justify-content:center;width:100%;background:var(--bg)}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:40px 36px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
.login-brand-icon{width:48px;height:48px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
.login-brand-text{font-size:20px;font-weight:700;color:var(--text)}
.login-brand-text small{display:block;font-size:12px;font-weight:400;color:var(--text3)}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.lf input{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.lf input:focus{border-color:var(--accent);background:#fff}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:40px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .15s;margin-top:4px}
.login-btn:hover{background:var(--accent-d)}
.login-err{background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--danger);margin-bottom:14px;display:none}
.login-note{text-align:center;font-size:11px;color:var(--text3);margin-top:18px}

/* ── SIDEBAR ── */
#sidebar{width:224px;min-width:224px;background:var(--sidebar);display:flex;flex-direction:column;transition:width .2s;position:relative}
#sidebar.col{width:58px;min-width:58px}
.sb-logo{padding:18px 14px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;overflow:hidden}
.sb-logo-ic{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex-shrink:0}
.sb-logo-tx{font-size:13px;font-weight:700;color:#eae6dd;white-space:nowrap;line-height:1.3}
.sb-logo-tx small{display:block;font-size:10px;font-weight:400;color:#808098;margin-top:1px}
.sb-nav{padding:10px 7px;flex:1;overflow-y:auto;overflow-x:hidden}
.sb-grp{font-size:10px;font-weight:700;letter-spacing:.08em;color:#5a5a7a;text-transform:uppercase;padding:10px 8px 3px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r);cursor:pointer;color:#8888a8;transition:all .15s;white-space:nowrap;margin-bottom:1px;font-size:13px;font-weight:500}
.sb-item:hover{background:var(--sidebar-hover);color:#eae6dd}
.sb-item.act{background:rgba(200,135,58,.16);color:var(--accent)}
.sb-item i{font-size:17px;flex-shrink:0;width:19px;text-align:center}
.sb-foot{padding:10px 7px;border-top:1px solid rgba(255,255,255,.06)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--r);overflow:hidden}
.sb-av{width:30px;height:30px;border-radius:50%;background:rgba(200,135,58,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent);flex-shrink:0}
.sb-uinfo{overflow:hidden}
.sb-uinfo b{display:block;font-size:12px;color:#eae6dd;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-uinfo span{font-size:10px;color:#5a5a7a}
.sb-logout{background:none;border:none;color:#5a5a7a;cursor:pointer;padding:6px 9px;border-radius:var(--r);font-size:12px;display:flex;align-items:center;gap:5px;width:100%;margin-top:2px;font-family:var(--font);font-weight:500;transition:all .15s}
.sb-logout:hover{color:#eae6dd;background:var(--sidebar-hover)}
.sb-toggle{width:100%;background:none;border:none;border-top:1px solid rgba(255,255,255,.05);padding:9px 0;cursor:pointer;color:#5a5a7a;font-size:15px;display:flex;align-items:center;justify-content:center;transition:color .15s}
.sb-toggle:hover{color:#eae6dd}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#topbar h2{font-size:16px;font-weight:700}
#topbar-acts{display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:20px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-d)}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg)}
.btn-success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ic{padding:6px;border-radius:var(--r);background:transparent;border:1px solid var(--border);cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;font-size:15px;transition:all .15s}
.btn-ic:hover{background:var(--bg);color:var(--text)}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card+.card{margin-top:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.ct{font-size:14px;font-weight:700}

/* ── FORMS ── */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.fi input,.fi select,.fi textarea{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--accent);background:#fff}
.fi textarea{resize:vertical;min-height:72px}
.ff{grid-column:1/-1}
.sdiv{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border-bottom:1px solid var(--border);padding-bottom:5px;margin:12px 0 8px;grid-column:1/-1}

/* ── TABLE ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 11px;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf7f3}

/* ── BADGES ── */
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:var(--success-bg);color:var(--success)}
.b-blue{background:var(--info-bg);color:var(--info)}
.b-amber{background:var(--warn-bg);color:var(--warn)}
.b-red{background:var(--danger-bg);color:var(--danger)}
.b-gray{background:#f0ece6;color:#6b5d4a}

/* ── STATS ── */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.sc-l{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sc-v{font-size:22px;font-weight:700}
.sc.acc{border-left:3px solid var(--accent)}
.sc.grn{border-left:3px solid var(--success)}
.sc.blu{border-left:3px solid var(--info)}
.sc.red{border-left:3px solid var(--danger)}

/* ── MODAL ── */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:500;align-items:center;justify-content:center;padding:16px}
.modal-ov.open{display:flex}
.modal-box{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:700px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.14)}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-hd h3{font-size:15px;font-weight:700}
.modal-bd{padding:20px;overflow-y:auto;flex:1}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

/* ── CALENDAR ── */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdl{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:5px 0;text-transform:uppercase;letter-spacing:.05em}
.cd{min-height:82px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:5px;cursor:pointer;transition:border-color .15s}
.cd:hover{border-color:var(--accent)}
.cd.om{background:#f5f2ed;opacity:.55}
.cd.td{border:2px solid var(--accent)}
.cdn{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:3px}
.cd.td .cdn{color:var(--accent);font-weight:700}
.ce{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ce.reserva{background:#bfdbf7;color:#1a4a7a}
.ce.confirmado{background:#bbf0d0;color:#155230}
.ce.pre-agenda{background:#ffd0d0;color:#8b1a1a}

/* ── FIN TABS ── */
.ftabs{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;width:fit-content;margin-bottom:14px}
.ftab{padding:7px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);background:var(--card);border:none;font-family:var(--font);transition:all .15s}
.ftab.act{background:var(--accent);color:#fff}
.ftab:not(:last-child){border-right:1px solid var(--border)}

/* ── TOGGLE ── */
.ctog{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--bg);transition:all .15s}
.ctog:hover,.ctog.on{border-color:var(--accent);background:var(--accent-light)}
.ctog input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

/* ── INFO BOX ── */
.ibox{background:var(--info-bg);border:1px solid var(--info-border);border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--info);grid-column:1/-1}
.wbox{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--warn);grid-column:1/-1}

/* ── SEARCH ── */
.sw{position:relative}
.sw input{padding-left:30px}
.sw i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}

/* ── BAR CHART ── */
.br{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bl{font-size:11px;color:var(--text2);width:80px;text-align:right;flex-shrink:0}
.bt{flex:1;height:12px;background:#ede8e0;border-radius:8px;overflow:hidden}
.bf{height:100%;border-radius:8px;transition:width .5s}
.bv{font-size:11px;font-weight:600;width:68px;flex-shrink:0}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;background:#1e1810;color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
#toast.show{opacity:1}

/* ── SYNC INDICATOR ── */
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-dot.ok{background:var(--success)}
.sync-dot.err{background:var(--danger)}
.sync-dot.loading{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:680px){
  #sidebar{width:52px;min-width:52px}
  #sidebar .sb-logo-tx,#sidebar .sb-item span,#sidebar .sb-grp,#sidebar .sb-uinfo,#sidebar .sb-logout span{display:none}
  .cd{min-height:44px}.ce{display:none}
  .fg{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- BOOT SCREEN -->
<div id="boot">
  <div class="sp"></div>
  <span style="font-size:13px;color:var(--text2)">Carregando sistema...</span>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <!-- LOGIN -->
  <div id="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon"><i class="ti ti-confetti"></i></div>
        <div class="login-brand-text">Salão Manager<small>Sistema de gestão de eventos</small></div>
      </div>
      <div class="login-err" id="lerr"></div>
      <div class="lf"><label>Usuário</label><input id="lu" placeholder="seu usuário" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="lf"><label>Senha</label>
        <div class="pw-wrap">
          <input type="password" id="lp" placeholder="sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%">
          <button class="pw-eye" onclick="togglePwd()" type="button"><i class="ti ti-eye" id="peye"></i></button>
        </div>
      </div>
      <button class="login-btn" id="lbtn" onclick="doLogin()">Entrar</button>
      <p class="login-note"><span class="sync-dot ok" id="conn-dot"></span>Dados sincronizados em tempo real</p>
    </div>
  </div>

  <!-- SHELL (sidebar + main) -->
  <div id="shell" style="display:none;width:100%">
    <div id="sidebar">
      <div class="sb-logo">
        <div class="sb-logo-ic"><i class="ti ti-confetti"></i></div>
        <div class="sb-logo-tx">Salão Manager<small>Gestão completa</small></div>
      </div>
      <nav class="sb-nav" id="nav"></nav>
      <div class="sb-foot">
        <div class="sb-user">
          <div class="sb-av" id="sb-av">AD</div>
          <div class="sb-uinfo"><b id="sb-nome">Admin</b><span id="sb-role">Administrador</span></div>
        </div>
        <button class="sb-logout" onclick="doLogout()"><i class="ti ti-logout" style="font-size:14px"></i><span>Sair</span></button>
      </div>
      <button class="sb-toggle" id="sbtgl" onclick="toggleSB()"><i class="ti ti-chevrons-left" id="sbic"></i></button>
    </div>
    <div id="main">
      <div id="topbar">
        <h2 id="pg-title">Dashboard</h2>
        <div id="topbar-acts">
          <span style="font-size:11px;color:var(--text3)"><span class="sync-dot ok" id="sync-dot"></span><span id="sync-txt">Sincronizado</span></span>
        </div>
      </div>
      <div id="content"></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-ov" id="modal">
  <div class="modal-box">
    <div class="modal-hd"><h3 id="modal-title">Modal</h3><button class="btn-ic" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    <div class="modal-bd" id="modal-body"></div>
    <div class="modal-ft" id="modal-foot"></div>
  </div>
</div>

<div id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════
     FIREBASE SDK
═══════════════════════════════════════════════════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDocs, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ╔══════════════════════════════════════════════════════════╗
// ║  ⚠️  SUBSTITUA PELOS SEUS DADOS DO FIREBASE  ⚠️          ║
// ╚══════════════════════════════════════════════════════════╝
 const firebaseConfig = {
    apiKey: "AIzaSyARy1VerzcXdUJCBzHQA8DrJmK6vdqF5Io",
    authDomain: "recanto-do-aconchego-eventos.firebaseapp.com",
    projectId: "recanto-do-aconchego-eventos",
    storageBucket: "recanto-do-aconchego-eventos.firebasestorage.app",
    messagingSenderId: "567805314565",
    appId: "1:567805314565:web:1a06a2ec659751d7e1be6c",
    measurementId: "G-032GT4SD1K"
  };


const fbApp = initializeApp(firebaseConfig);
const db    = getFirestore(fbApp);
// ──────────────────────────────────────────────────────────
// ESTADO GLOBAL
// ──────────────────────────────────────────────────────────
window.ST = {
  user: null, page: 'dashboard', finTab: 'receber',
  calDate: new Date(),
  users:[], clientes:[], fornecs:[], contratos:[], eventos:[], financ:[], pre_agenda:[],
  locador: {}
};

// helpers de acesso ao Firestore
window.DB = {
  async getAll(col){ const s=await getDocs(collection(db,col)); return s.docs.map(d=>({id:d.id,...d.data()})); },
  async getDoc(col,id){ const d=await getDoc(doc(db,col,id)); return d.exists()?{id:d.id,...d.data()}:null; },
  async set(col,id,data){ await setDoc(doc(db,col,id),data); },
  async add(col,data){ const r=await addDoc(collection(db,col),data); return r.id; },
  async upd(col,id,data){ await updateDoc(doc(db,col,id),data); },
  async del(col,id){ await deleteDoc(doc(db,col,id)); },
  listen(col,cb){ return onSnapshot(collection(db,col),snap=>{ cb(snap.docs.map(d=>({id:d.id,...d.data()}))); }); }
};

// ──────────────────────────────────────────────────────────
// BOOT: carrega dados, configura listeners de tempo real
// ──────────────────────────────────────────────────────────
async function boot(){
  setSyncStatus('loading','Conectando...');
  try {
    // Dados estáticos (locador)
    const locDoc = await DB.getDoc('config','locador');
    ST.locador = locDoc || defaultLocador();

    // Carrega coleções iniciais em paralelo
    const [users,clientes,fornecs,contratos,eventos,financ,pre_agenda] = await Promise.all([
      DB.getAll('users'), DB.getAll('clientes'), DB.getAll('fornecs'),
      DB.getAll('contratos'), DB.getAll('eventos'), DB.getAll('financ'), DB.getAll('pre_agenda')
    ]);

    ST.users    = users;
    ST.clientes = clientes;
    ST.fornecs  = fornecs;
    ST.contratos= contratos;
    ST.eventos  = eventos;
    ST.financ   = financ;
    ST.pre_agenda = pre_agenda;

    // Usuários padrão se banco vazio
    if(!ST.users.length){
      await DB.set('users','admin1',{username:'admin1',password:'admin123',nome:'Administrador 1',role:'admin'});
      await DB.set('users','admin2',{username:'admin2',password:'admin123',nome:'Administrador 2',role:'admin'});
      ST.users = await DB.getAll('users');
    }

    // Listeners em tempo real para sincronização
    DB.listen('clientes',  d=>{ST.clientes=d;  if(ST.page==='clientes')    renderPage();});
    DB.listen('fornecs',   d=>{ST.fornecs=d;   if(ST.page==='fornecedores')renderPage();});
    DB.listen('contratos', d=>{ST.contratos=d; if(ST.page==='contratos')   renderPage();});
    DB.listen('eventos',   d=>{ST.eventos=d;   if(ST.page==='agenda')      renderPage();});
    DB.listen('financ',    d=>{ST.financ=d;    if(ST.page==='financeiro')  renderPage();});
    DB.listen('users',     d=>{ST.users=d;     if(ST.page==='usuarios')    renderPage();});
    DB.listen('pre_agenda',d=>{ST.pre_agenda=d;if(ST.page==='agenda')      renderPage();});

    setSyncStatus('ok','Sincronizado');
    document.getElementById('boot').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('login-wrap').style.display='flex';

  } catch(e){
    console.error(e);
    setSyncStatus('err','Erro de conexão');
    document.getElementById('boot').innerHTML=`
      <div style="text-align:center;padding:24px;max-width:420px">
        <div style="font-size:14px;font-weight:700;color:#b83030;margin-bottom:8px">Erro ao conectar ao Firebase</div>
        <div style="font-size:13px;color:#6b5d4a;line-height:1.6">Verifique se você preencheu corretamente as credenciais do Firebase no arquivo <code>index.html</code>. Consulte o <b>README.md</b> para instruções detalhadas.</div>
      </div>`;
  }
}

function setSyncStatus(state,txt){
  const dot=document.getElementById('sync-dot');
  const cdot=document.getElementById('conn-dot');
  const stxt=document.getElementById('sync-txt');
  if(dot){dot.className='sync-dot '+state;}
  if(cdot){cdot.className='sync-dot '+state;}
  if(stxt){stxt.textContent=txt;}
}

window.togglePwd=function(){
  const i=document.getElementById('lp'),ic=document.getElementById('peye');
  i.type=i.type==='password'?'text':'password';
  ic.className=i.type==='password'?'ti ti-eye':'ti ti-eye-off';
};

window.doLogin=async function(){
  const u=(document.getElementById('lu').value||'').trim().toLowerCase();
  const p=(document.getElementById('lp').value||'').trim();
  const err=document.getElementById('lerr');
  const btn=document.getElementById('lbtn');
  err.style.display='none';
  if(!u||!p){err.textContent='Preencha usuário e senha.';err.style.display='block';return;}
  btn.textContent='Verificando...';btn.disabled=true;
  await new Promise(r=>setTimeout(r,300));
  const found=ST.users.find(x=>x.username.toLowerCase()===u&&x.password===p);
  btn.textContent='Entrar';btn.disabled=false;
  if(!found){err.textContent='Usuário ou senha incorretos.';err.style.display='block';return;}
  ST.user=found;
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('shell').style.display='flex';
  document.getElementById('shell').style.width='100%';
  const ini=found.nome.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('sb-av').textContent=ini;
  document.getElementById('sb-nome').textContent=found.nome;
  document.getElementById('sb-role').textContent=found.role==='admin'?'Administrador':'Operador';
  navigate('dashboard');
};

window.doLogout=function(){
  ST.user=null; ST.page='dashboard';
  document.getElementById('shell').style.display='none';
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('lu').value='';
  document.getElementById('lp').value='';
};

function pgAgenda(){
  const d=ST.calDate,yr=d.getFullYear(),mo=d.getMonth();
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const first=new Date(yr,mo,1).getDay(),last=new Date(yr,mo+1,0).getDate();
  const today=new Date(),prevLen=new Date(yr,mo,0).getDate();
  let cells='';
  dias.forEach(d=>cells+=`<div class="cdl">${d}</div>`);
  let day=1;
  for(let i=0;i<42;i++){
    if(i<first){cells+=`<div class="cd om"><div class="cdn">${prevLen-first+i+1}</div></div>`;}
    else if(day>last){cells+=`<div class="cd om"><div class="cdn">${day++-last}</div></div>`;}
    else{
      const isT=today.getFullYear()===yr&&today.getMonth()===mo&&today.getDate()===day;
      const d2=`${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      // eventos de contrato
      const evts=ST.eventos.filter(ev=>{const c=ST.contratos.find(x=>x.id===ev.contrato_id);return c&&c.data_evento===d2;});
      // pré-agendas
      const preEvts=(ST.pre_agenda||[]).filter(p=>p.data===d2);
      const evHtml=evts.map(ev=>{
        const c=ST.contratos.find(x=>x.id===ev.contrato_id);
        const cl=ST.clientes.find(x=>x.id===(c?c.cliente_id:''));
        return `<div class="ce ${ev.status}">${cl?cl.nome.split(' ')[0]:'Evento'}</div>`;
      }).join('')+preEvts.map(p=>`<div class="ce pre-agenda" title="${p.descricao}">📋 ${p.descricao.substring(0,14)}${p.descricao.length>14?'…':''}</div>`).join('');
      cells+=`<div class="cd${isT?' td':''}" onclick="calClick('${d2}')"><div class="cdn">${day}</div>${evHtml}</div>`;
      day++;
    }
  }
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button class="btn btn-secondary btn-sm" onclick="calMv(-1)"><i class="ti ti-chevron-left"></i></button>
      <b style="font-size:15px;font-weight:700">${meses[mo]} ${yr}</b>
      <button class="btn btn-secondary btn-sm" onclick="calMv(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      <span style="display:flex;align-items:center;gap:5px;font-size:12px"><span style="width:12px;height:12px;border-radius:2px;background:#bfdbf7;display:inline-block"></span>Reserva</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:12px"><span style="width:12px;height:12px;border-radius:2px;background:#bbf0d0;display:inline-block"></span>Confirmado</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:12px"><span style="width:12px;height:12px;border-radius:2px;background:#ffd0d0;display:inline-block"></span>Pré-Agenda</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:12px"><span style="width:12px;height:12px;border-radius:2px;background:#fff;border:1px solid var(--border);display:inline-block"></span>Livre</span>
    </div>
    <div class="cg">${cells}</div>
  </div>`;
}
window.calMv=function(dir){ST.calDate=new Date(ST.calDate.getFullYear(),ST.calDate.getMonth()+dir,1);renderPage();};
window.calClick=function(date){
  const evts=ST.eventos.filter(ev=>{const c=ST.contratos.find(x=>x.id===ev.contrato_id);return c&&c.data_evento===date;});
  const preEvts=(ST.pre_agenda||[]).filter(p=>p.data===date);
  let msg='';
  if(evts.length){
    evts.forEach(ev=>{
      const c=ST.contratos.find(x=>x.id===ev.contrato_id);
      const cl=ST.clientes.find(x=>x.id===(c?c.cliente_id:''));
      msg+=`📅 EVENTO\nCliente: ${cl?cl.nome:'—'}\nFinalidade: ${c?c.finalidade:'—'}\nStatus: ${ev.status}\nHorário: ${c?c.horario_inicio+' às '+c.horario_fim:'—'}\nConvidados: ${c?c.num_convidados:0}\n\n`;
    });
  }
  if(preEvts.length){
    preEvts.forEach(p=>{
      msg+=`📋 PRÉ-AGENDA\n${p.descricao}\n(ID: ${p.id})\n\n`;
    });
  }
  if(msg) alert(msg.trim());
};

window.savePessoa=async function(type,id){

window.saveContrato=async function(id){
  const cid=gv('ct-cl');if(!cid){alert('Selecione o cliente');return;}
  const data=gv('ct-data');if(!data){alert('Informe a data');return;}
  const uL=gb('ct-ul'),uC=gb('ct-uc');
  const obj={cliente_id:cid,data_evento:data,horario_inicio:gv('ct-ini'),horario_fim:gv('ct-fim'),finalidade:gv('ct-final'),num_convidados:parseInt(gv('ct-conv'))||0,valor:parseFloat(gv('ct-val'))||0,valor_sinal:parseFloat(gv('ct-sinal'))||0,data_sinal:gv('ct-dsinal'),valor_restante:parseFloat(gv('ct-rest'))||0,data_restante:gv('ct-drest'),taxa_limpeza:parseFloat(gv('ct-limp'))||250,usar_limpeza:uL,caucao:parseFloat(gv('ct-cauc'))||500,usar_caucao:uC,status:gv('ct-st'),observacoes:gv('ct-obs'),num:ST.contratos.length+1};
  const clNome=ST.clientes.find(x=>x.id===cid)?.nome||'';
  if(id){await DB.upd('contratos',id,obj);toast('Contrato atualizado!');}
  else{
    const cid2=await DB.add('contratos',obj);
    const n=obj.num;
    if(obj.valor_sinal>0&&obj.data_sinal) await DB.add('financ',{tipo:'receber',descricao:`Sinal - Contrato #${n} (${clNome})`,valor:obj.valor_sinal,vencimento:obj.data_sinal,status:'pendente',contrato_id:cid2});
    if(obj.valor_restante>0&&obj.data_restante) await DB.add('financ',{tipo:'receber',descricao:`Restante - Contrato #${n} (${clNome})`,valor:obj.valor_restante,vencimento:obj.data_restante,status:'pendente',contrato_id:cid2});
    if(uL&&obj.taxa_limpeza>0&&obj.data_restante) await DB.add('financ',{tipo:'receber',descricao:`Taxa Limpeza - Contrato #${n} (${clNome})`,valor:obj.taxa_limpeza,vencimento:obj.data_restante,status:'pendente',contrato_id:cid2});
    if(uC&&obj.caucao>0&&obj.data_sinal) await DB.add('financ',{tipo:'receber',descricao:`Caução - Contrato #${n} (${clNome})`,valor:obj.caucao,vencimento:obj.data_sinal,status:'pendente',contrato_id:cid2});
    await DB.add('eventos',{contrato_id:cid2,status:obj.status});
    toast('Contrato cadastrado e evento adicionado à agenda!');
  }
  closeModal();
};

window.saveLancamento=async function(){
  const desc=gv('la-desc');if(!desc){alert('Informe a descrição');return;}
  const valor=parseFloat(gv('la-val'));if(!valor){alert('Informe o valor');return;}
  const venc=gv('la-venc');if(!venc){alert('Informe o vencimento');return;}
  await DB.add('financ',{tipo:gv('la-tipo'),descricao:desc,valor,vencimento:venc,status:gv('la-st'),contrato_id:gv('la-ct')||null});

window.saveUsuario=async function(id){
  const nome=gv('us-nome');if(!nome){alert('Nome obrigatório');return;}
  const username=gv('us-user').toLowerCase().replace(/\s/g,'');if(!username){alert('Usuário obrigatório');return;}
  const pass=gv('us-pass');
  if(!id&&pass.length<6){alert('Senha mínima de 6 caracteres');return;}
  if(ST.users.find(x=>x.username===username&&x.id!==id)){alert('Este usuário já existe');return;}
  if(id){
    const upd={nome,username,role:gv('us-role')};
    if(pass.length>=6)upd.password=pass;
    await DB.upd('users',id,upd);
  }else{
    await DB.add('users',{username,password:pass,nome,role:gv('us-role')});
  }
  toast('Usuário salvo!');closeModal();
};

window.gerarPDF=function(id){
  const c=ST.contratos.find(x=>x.id===id);if(!c)return;
  const cl=ST.clientes.find(x=>x.id===c.cliente_id);
  const L=ST.locador;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const lm=25,rm=185,lw=160;
  let y=20;

  // ── helpers ──
  const newPageIfNeeded=(needed=10)=>{ if(y+needed>278){doc.addPage();y=20;} };
  const ln=(n=5)=>{ y+=n; };

  const titulo=(txt)=>{
    doc.setFontSize(12);doc.setFont('times','bold');
    const lines=doc.splitTextToSize(txt,lw);
    lines.forEach(l=>{newPageIfNeeded();doc.text(l,105,y,{align:'center'});y+=6;});
    ln(2);
  };

  const paragrafo=(txt,indent=0,sz=10.5,bold=false)=>{
    doc.setFontSize(sz);doc.setFont('times',bold?'bold':'normal');
    const lines=doc.splitTextToSize(txt,lw-indent);
    lines.forEach(l=>{newPageIfNeeded();doc.text(l,lm+indent,y);y+=sz*0.42;});
    ln(3);
  };

  const clausula=(num,titulo_cl)=>{
    newPageIfNeeded(12);
    ln(2);
    doc.setFontSize(10.5);doc.setFont('times','bold');
    doc.text(`CLÁUSULA ${num} – ${titulo_cl}`,lm,y);
    ln(6);
  };

  const item=(txt,sz=10.5)=>{
    doc.setFontSize(sz);doc.setFont('times','normal');
    const lines=doc.splitTextToSize(txt,lw-4);
    lines.forEach(l=>{newPageIfNeeded();doc.text(l,lm+4,y);y+=sz*0.42;});
    ln(3);
  };

  const hr=()=>{ newPageIfNeeded(6);doc.setDrawColor(120);doc.setLineWidth(0.3);doc.line(lm,y,rm,y);ln(5); };

  const clNome = cl?cl.nome:'_______________________________________________';
  const clCpf  = cl?cl.cpf||cl.cnpj:'_________________________';
  const clEnd  = cl?cl.endereco:'______________________________________________';
  const clNasc = cl&&cl.nascimento?new Date(cl.nascimento+'T12:00:00').toLocaleDateString('pt-BR'):'___/___/______';

  // Determinar nacionalidade/estado civil do locatário (se tiver no cadastro, senão placeholder)
  const de = c.data_evento?new Date(c.data_evento+'T12:00:00').toLocaleDateString('pt-BR'):'___/___/______';
  const dSinal = c.data_sinal?new Date(c.data_sinal+'T12:00:00').toLocaleDateString('pt-BR'):'___/___/______';
  const dRest  = c.data_restante?new Date(c.data_restante+'T12:00:00').toLocaleDateString('pt-BR'):'___/___/______';

  // ══════════════════════════════════════════════
  // CABEÇALHO
  // ══════════════════════════════════════════════
  titulo('CONTRATO DE LOCAÇÃO DE SALÃO DE FESTAS PARA EVENTO');
  hr();

  // Qualificação das partes
  paragrafo('Pelo presente instrumento particular de Contrato de Locação de Salão de Festas para Evento, de um lado:');
  ln(1);
  paragrafo(`LOCADOR: ${L.nome||'___'}, ${L.estado_civil||'___'}, ${L.profissao||'___'}, portador do RG nº ${L.rg||'___'} ${L.orgao_rg||''} e CPF nº ${L.cpf||'___'}, residente e domiciliado na ${L.endereco||'___'}, CEP ${L.cep||'___'};`,0,10.5,true);
  ln(1);
  paragrafo('E de outro lado:');
  ln(1);
  paragrafo(`LOCATÁRIO(A): ${clNome}, CPF/CNPJ nº ${clCpf}, residente e domiciliado(a) na ${clEnd};`,0,10.5,true);
  ln(2);
  paragrafo('Têm entre si, justo e contratado, o presente Contrato de Locação de Salão de Festas para Evento, mediante as cláusulas e condições seguintes:');
  hr();

  // ══════════════════════════════════════════════
  // CLÁUSULA 1 – OBJETO
  // ══════════════════════════════════════════════
  clausula('PRIMEIRA','DO OBJETO DA LOCAÇÃO');
  item(`1.1. O presente contrato tem como objeto a locação do imóvel comercial destinado a eventos, denominado "${L.nome_salao||'___'}", localizado na ${L.end_salao||'___'}, CEP ${L.cep_salao||'___'}, doravante denominado simplesmente "IMÓVEL".`);
  item(`1.2. A locação inclui o uso do(a): ${L.desc_salao||'___'}`);

  // ══════════════════════════════════════════════
  // CLÁUSULA 2 – FINALIDADE E PRAZO
  // ══════════════════════════════════════════════
  clausula('SEGUNDA','DA FINALIDADE E PRAZO DA LOCAÇÃO');
  item(`2.1. A locação destina-se exclusivamente à realização de ${c.finalidade||'___'}, a ser realizada na data de ${de}.`);
  item(`2.2. O período de locação terá início às ${c.horario_inicio||'___'} do dia ${de} para montagem e preparação do evento, e se encerrará impreterivelmente às ${c.horario_fim||'___'} para desmontagem e desocupação total do IMÓVEL.`);
  item(`2.3. O número estimado de convidados para o evento é de ${c.num_convidados||'___'} (${numPorExtenso(c.num_convidados||0)}) pessoas. O LOCATÁRIO se compromete a não exceder a capacidade máxima de pessoas permitida pelo IMÓVEL, conforme alvará de funcionamento, sob pena de multa e rescisão contratual.`);

  // ══════════════════════════════════════════════
  // CLÁUSULA 3 – VALOR E PAGAMENTO
  // ══════════════════════════════════════════════
  clausula('TERCEIRA','DO VALOR DA LOCAÇÃO E FORMA DE PAGAMENTO');
  item(`3.1. O valor total da locação do IMÓVEL para o período e finalidade estabelecidos na Cláusula Segunda é de R$ ${(c.valor||0).toLocaleString('pt-BR')} (${valorPorExtenso(c.valor||0)}).`);
  item(`3.2. O pagamento será efetuado da seguinte forma:`);
  item(`a) R$ ${(c.valor_sinal||0).toLocaleString('pt-BR')} (${valorPorExtenso(c.valor_sinal||0)}) no ato da assinatura do presente contrato, a título de sinal e princípio de pagamento (data prevista: ${dSinal});`);
  item(`b) O saldo remanescente de R$ ${(c.valor_restante||0).toLocaleString('pt-BR')} (${valorPorExtenso(c.valor_restante||0)}) deverá ser pago até ${dRest}.`);
  item(`3.3. Em caso de atraso no pagamento do saldo remanescente, incidirá multa de 2% (dois por cento) sobre o valor devido, acrescido de juros de mora de 1% (um por cento) ao mês e correção monetária pelo IPCA, sem prejuízo da rescisão do contrato e retenção do valor já pago.`);

  // Dados de pagamento
  let dadosPgto=[];
  if(L.chave_pix) dadosPgto.push(`PIX (${L.tipo_pix||'chave'}): ${L.chave_pix}`);
  if(L.banco)     dadosPgto.push(`Banco: ${L.banco}${L.agencia?' | Agência: '+L.agencia:''}${L.conta?' | Conta '+L.tipo_conta+': '+L.conta:''}`);
  if(dadosPgto.length) item(`3.4. Dados para pagamento: ${dadosPgto.join(' — ')}`);

  // ══════════════════════════════════════════════
  // CLÁUSULAS OPCIONAIS
  // ══════════════════════════════════════════════
  let numCl=4;
  const rom=['PRIMEIRA','SEGUNDA','TERCEIRA','QUARTA','QUINTA','SEXTA','SÉTIMA','OITAVA','NONA','DÉCIMA','DÉCIMA PRIMEIRA','DÉCIMA SEGUNDA'];

  if(c.usar_limpeza){
    clausula(rom[numCl-1],'DA TAXA DE LIMPEZA');
    item(`${numCl}.1. Além do valor da locação, o LOCATÁRIO pagará uma taxa de limpeza no valor de R$ ${(c.taxa_limpeza||0).toLocaleString('pt-BR')} (${valorPorExtenso(c.taxa_limpeza||0)}), a ser paga juntamente com o saldo remanescente da locação, conforme item 3.2 "b".`);
    item(`${numCl}.2. Esta taxa cobre a limpeza básica do IMÓVEL após o evento. Caso o IMÓVEL seja entregue em estado de sujeira excessiva ou com danos que exijam limpeza especializada, o LOCATÁRIO arcará com os custos adicionais, que serão descontados do valor do caução ou cobrados à parte, se o valor do caução for insuficiente.`);
    numCl++;
  }

  if(c.usar_caucao){
    clausula(rom[numCl-1],'DO CAUÇÃO/GARANTIA');
    item(`${numCl}.1. A título de garantia para cobrir eventuais danos ao IMÓVEL, seus equipamentos e mobiliários, bem como para cobrir despesas adicionais de limpeza ou multas, o LOCATÁRIO depositará a quantia de R$ ${(c.caucao||0).toLocaleString('pt-BR')} (${valorPorExtenso(c.caucao||0)}), no ato da assinatura do presente contrato.`);
    item(`${numCl}.2. O valor do caução será restituído ao LOCATÁRIO em até 5 (cinco) dias úteis após o término da locação e vistoria do IMÓVEL pelo LOCADOR, desde que não haja danos, avarias ou pendências financeiras.`);
    item(`${numCl}.3. Caso sejam constatados danos ou avarias que excedam o valor do caução, o LOCATÁRIO se compromete a ressarcir o LOCADOR pela diferença, no prazo de 5 (cinco) dias úteis após a notificação.`);
    numCl++;
  }

  // ══════════════════════════════════════════════
  // CLÁUSULA RUÍDO
  // ══════════════════════════════════════════════
  clausula(rom[numCl-1],'DO NÍVEL DE RUÍDO E POLUIÇÃO SONORA');
  item(`${numCl}.1. O LOCATÁRIO se compromete a zelar pelo sossego e bem-estar da vizinhança, responsabilizando-se integralmente pela observância das normas relativas à emissão de ruídos e poluição sonora durante todo o período de locação do imóvel.`);
  item(`${numCl}.2. O LOCATÁRIO declara-se ciente e concorda em cumprir rigorosamente as disposições da ${L.lei_ruido||'legislação municipal de controle de poluição sonora'}, bem como quaisquer outras normas municipais, estaduais ou federais aplicáveis à matéria.`);
  item(`${numCl}.3. Fica expressamente estabelecido que o volume do som e das atividades musicais deverá ser moderado a partir das ${L.hora_ruido||'23h00'}, respeitando os limites de decibéis estabelecidos pela legislação municipal para o período noturno.`);
  item(`${numCl}.4. Qualquer multa, autuação, penalidade ou sanção imposta pelas autoridades competentes em decorrência do descumprimento das normas de ruído durante o evento será de inteira e exclusiva responsabilidade do LOCATÁRIO.`);
  item(`${numCl}.5. O LOCATÁRIO deverá orientar seus convidados, prestadores de serviço (DJs, bandas, etc.) e demais envolvidos sobre a necessidade de cumprimento das regras de ruído, sendo o único responsável por sua fiscalização.`);
  numCl++;

  // ══════════════════════════════════════════════
  // CLÁUSULA RESPONSABILIDADES
  // ══════════════════════════════════════════════
  clausula(rom[numCl-1],'DAS RESPONSABILIDADES DO LOCATÁRIO');
  item(`${numCl}.1. O LOCATÁRIO se responsabiliza pela conservação do IMÓVEL e de todos os bens nele contidos durante o período de locação, devendo restituí-lo nas mesmas condições em que o recebeu, ressalvado o desgaste natural pelo uso.`);
  item(`${numCl}.2. O LOCATÁRIO será o único responsável por quaisquer danos materiais ou pessoais causados ao IMÓVEL, aos bens nele existentes, a terceiros (convidados, prestadores de serviço, vizinhos) ou a si próprio, decorrentes do uso indevido, negligência ou imperícia, durante o período de locação.`);
  item(`${numCl}.3. É vedado ao LOCATÁRIO sublocar, ceder ou emprestar o IMÓVEL a terceiros, total ou parcialmente, sem a prévia e expressa autorização do LOCADOR.`);
  item(`${numCl}.4. O LOCATÁRIO deverá providenciar, por sua conta e risco, toda a documentação e licenças necessárias para a realização do evento, caso exigidas pelas autoridades competentes, isentando o LOCADOR de qualquer responsabilidade.`);
  item(`${numCl}.5. É de responsabilidade do LOCATÁRIO a retirada de todo o lixo e detritos gerados pelo evento, devidamente acondicionados, antes da devolução das chaves.`);
  numCl++;

  // ══════════════════════════════════════════════
  // CLÁUSULA ENTREGA DE CHAVES
  // ══════════════════════════════════════════════
  clausula(rom[numCl-1],'DA ENTREGA E DEVOLUÇÃO DAS CHAVES');
  item(`${numCl}.1. As chaves do IMÓVEL serão entregues ao LOCATÁRIO às ${c.horario_inicio||'___'} do dia ${de}, mediante termo de vistoria inicial, que deverá ser assinado por ambas as partes.`);
  item(`${numCl}.2. As chaves do IMÓVEL deverão ser devolvidas ao LOCADOR impreterivelmente às ${c.horario_fim||'___'}, mediante termo de vistoria final, que deverá ser assinado por ambas as partes.`);
  item(`${numCl}.3. A não devolução das chaves no horário estipulado implicará na cobrança de multa diária de R$ 500,00 (quinhentos reais), sem prejuízo de outras medidas legais cabíveis.`);
  numCl++;

  // ══════════════════════════════════════════════
  // CLÁUSULA RESCISÃO
  // ══════════════════════════════════════════════
  clausula(rom[numCl-1],'DA RESCISÃO E MULTA');
  item(`${numCl}.1. O presente contrato poderá ser rescindido de pleno direito em caso de descumprimento de qualquer uma das cláusulas e condições aqui estabelecidas.`);
  item(`${numCl}.2. Em caso de rescisão por iniciativa do LOCATÁRIO, ou por sua culpa, o valor pago a título de sinal será retido pelo LOCADOR como multa compensatória, sem prejuízo da cobrança de eventuais danos causados.`);
  item(`${numCl}.3. Em caso de rescisão por iniciativa do LOCADOR, ou por sua culpa, o LOCADOR deverá restituir ao LOCATÁRIO o valor pago a título de sinal em dobro, sem prejuízo de outras indenizações cabíveis.`);
  numCl++;

  // ══════════════════════════════════════════════
  // CLÁUSULA FORO
  // ══════════════════════════════════════════════
  clausula(rom[numCl-1],'DO FORO');
  item(`${numCl}.1. As partes elegem o foro da Comarca de ${L.foro||'___'} para dirimir quaisquer dúvidas ou litígios decorrentes do presente contrato, renunciando a qualquer outro, por mais privilegiado que seja.`);

  // ══════════════════════════════════════════════
  // ASSINATURAS
  // ══════════════════════════════════════════════
  hr();
  const cidade=L.foro?L.foro.split(',')[0]:'Uberlândia/MG';
  paragrafo(`E, por estarem assim justos e contratados, as partes assinam o presente em 2 (duas) vias de igual teor e forma, na presença das 2 (duas) testemunhas abaixo, para que produza seus jurídicos e legais efeitos.`);
  ln(2);
  paragrafo(`${cidade}, ${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}.`);
  ln(14);

  doc.setFontSize(10);doc.setFont('times','normal');
  // Locador
  doc.line(lm,y,lm+70,y);
  doc.line(105,y,105+70,y);
  ln(5);
  doc.setFont('times','bold');
  doc.text('LOCADOR:',lm,y);
  doc.text('LOCATÁRIO(A):',105,y);
  ln(5);
  doc.setFont('times','normal');
  doc.text(L.nome||'___',lm,y);
  doc.text(clNome,105,y);
  ln(5);
  doc.text(`CPF: ${L.cpf||'___'}`,lm,y);
  doc.text(`CPF/CNPJ: ${clCpf}`,105,y);
  ln(16);

  // Testemunhas
  doc.setFont('times','bold');
  doc.text('TESTEMUNHAS:',lm,y);ln(8);
  doc.setFont('times','normal');
  doc.line(lm,y,lm+70,y);
  doc.line(105,y,105+70,y);
  ln(5);
  doc.text('Nome:',lm,y);doc.text('Nome:',105,y);ln(5);
  doc.text('CPF:',lm,y);doc.text('CPF:',105,y);ln(14);
  doc.line(lm,y,lm+70,y);
  doc.line(105,y,105+70,y);
  ln(5);
  doc.text('Nome:',lm,y);doc.text('Nome:',105,y);ln(5);
  doc.text('CPF:',lm,y);doc.text('CPF:',105,y);
  ln(10);

  hr();
  doc.setFontSize(8);doc.setFont('times','italic');
  doc.text('Nota de Isenção: Este documento é de caráter informativo. Recomenda-se que este contrato seja revisado por um advogado de sua confiança para adequação a quaisquer particularidades e para garantir a plena validade e eficácia jurídica.',lm,y,{maxWidth:lw});

  doc.save(`Contrato_${c.num||id.slice(-4)}_${clNome.replace(/\s+/g,'_')}.pdf`);
};

// ── auxiliares do PDF ──
function numPorExtenso(n){
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c2=['','cem','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  if(!n||n===0)return'zero';
  if(n<20)return u[n];
  if(n<100)return d[Math.floor(n/10)]+(n%10?' e '+u[n%10]:'');
  if(n===100)return'cem';
  if(n<1000)return c2[Math.floor(n/100)]+(n%100?' e '+numPorExtenso(n%100):'');
  return n.toString();
}
function valorPorExtenso(v){
  if(!v)return'zero reais';
  const int=Math.floor(v);
  const cent=Math.round((v-int)*100);
  let s=numPorExtenso(int)+(int===1?' real':' reais');
  if(cent>0)s+=' e '+numPorExtenso(cent)+(cent===1?' centavo':' centavos');
  return s;
}

window.filterTbl=function(input,tid){
  const v=input.value.toLowerCase();
  document.querySelectorAll(`#${tid} tbody tr`).forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(v)?'':'none';});
};

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

}
